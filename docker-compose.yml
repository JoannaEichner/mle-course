# Local S3-compatible storage for module 15: the moto server.
#   docker compose up -d
# API: http://localhost:9000. The same server runs without Docker:
#   uv run moto_server -p 9000
# (MinIO, used in earlier drafts, stopped publishing community images in 2025.)
services:
  s3:
    image: motoserver/moto:5.2.3
    ports:
      - "9000:5000"
