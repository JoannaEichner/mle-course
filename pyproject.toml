[project]
name = "mle-course"
version = "0.1.0"
description = "ML Engineering from Scratch: kurs od podstaw Pythona do ML engineera"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jakub Eichner" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=3.0,<4",
    "pyarrow>=18",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "holidays>=0.60",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.scripts]
course = "coursekit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
]
# Only for building the learner view and verifying the course (solutions branch).
authoring = [
    "jupytext>=1.16",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshcast", "src/coursekit"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["_main", "labs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "C90"]
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["freshcast", "coursekit"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_return_any = true
show_error_codes = true
disallow_untyped_defs = true
exclude = ["_main/"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "holidays.*", "jupytext.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
